# Categories (define README sections). Keep ≤ 8 top-level categories; add children as needed.
# Projects reference a category as "top/child" in projects.yaml.
# English is the default; *_zh fields hold the Chinese text.
kinds:
  frontier: { name: Frontier, name_zh: 前沿, emoji: "🔭", desc: "Frontier models, research code, paper collections", desc_zh: 前沿模型、研究代码、论文合集 }
  practice: { name: Practice, name_zh: 实践, emoji: "📐", desc: "Engineering practices, cookbooks, reference implementations, tutorials", desc_zh: 工程实践、Cookbook、参考实现、教程 }
  tool:     { name: Tool,     name_zh: 工具, emoji: "🛠", desc: "Ready-to-use frameworks, platforms and libraries", desc_zh: 可直接使用的框架、平台、库 }

rings:
  adopt:  { name: Adopt,  name_zh: 采用, desc: "Used in our projects; recommended default choice", desc_zh: 已在项目中使用，推荐默认选型 }
  trial:  { name: Trial,  name_zh: 试用, desc: "Worth trying in a real project at small scale", desc_zh: 值得在真实项目中小范围试用 }
  assess: { name: Assess, name_zh: 评估, desc: "Worth watching and researching; not yet used", desc_zh: 值得关注和调研，尚未实践 }
  hold:   { name: Hold,   name_zh: 暂缓, desc: "No longer recommended (unmaintained, superseded or unsuitable)", desc_zh: 不再推荐（停更、被替代或不适配） }

categories:
  - id: ai-native
    short: AI Native
    short_zh: AI Native
    name: AI Native
    name_zh: AI Native
    desc: Agents, LLM application engineering and AI infrastructure
    desc_zh: Agent、LLM 应用工程与 AI 基础设施
    children:
      - { id: agent-framework, name: Agent Frameworks & Orchestration, name_zh: Agent 框架与编排 }
      - { id: coding-agent,    name: AI Coding & Autonomous Agents,    name_zh: AI 编程与自主 Agent }
      - { id: mcp,             name: MCP & Tool Ecosystem,             name_zh: MCP 与工具生态 }
      - { id: app-platform,    name: LLM App Platforms,                name_zh: LLM 应用平台 }
      - { id: inference,       name: Inference & Serving,              name_zh: 推理与部署 }
      - { id: llmops,          name: "Observability, Evaluation & Gateways", name_zh: 观测、评测与网关 }
      - { id: practice,        name: Engineering Practices & Learning, name_zh: 工程实践与学习资料 }

  - id: ontology
    short: Ontology
    short_zh: 本体图谱
    name: Ontology & Knowledge Graphs
    name_zh: Ontology 与知识图谱
    desc: Ontology modeling, semantic web, graph databases, GraphRAG
    desc_zh: 本体建模、语义网、图数据库、GraphRAG
    children:
      - { id: modeling, name: Ontology Modeling & Semantic Web, name_zh: 本体建模与语义网 }
      - { id: graph-db, name: Graph Databases & Triple Stores,  name_zh: 图数据库与三元组存储 }
      - { id: graphrag, name: GraphRAG & Agent Memory,          name_zh: GraphRAG 与 Agent 记忆 }

  - id: vlm
    short: VLM
    short_zh: VLM
    name: Vision-Language Models
    name_zh: VLM 视觉语言模型
    desc: Multimodal LLMs, vision foundation models, training and evaluation
    desc_zh: 多模态大模型、视觉基础模型、训练与评测
    children:
      - { id: models,     name: Open VLMs,                                name_zh: 开源 VLM 模型 }
      - { id: foundation, name: Vision Foundation Models (Segmentation / Detection), name_zh: 视觉基础模型（分割 / 检测） }
      - { id: train-eval, name: "Training, Fine-tuning & Evaluation",     name_zh: 训练、微调与评测 }
      - { id: survey,     name: Papers & Resource Collections,            name_zh: 论文与资料合集 }

  - id: remote-sensing
    short: Remote Sensing
    short_zh: 遥感
    name: Remote Sensing & Geospatial
    name_zh: 遥感与地理空间
    desc: Remote sensing foundation models, intelligent interpretation, geospatial data infrastructure
    desc_zh: 遥感基础模型、遥感智能解译、地理空间数据基础设施
    children:
      - { id: foundation, name: RS Foundation Models & RS VLMs,   name_zh: 遥感基础模型与遥感 VLM }
      - { id: dl-tools,   name: RS Deep Learning Tools,           name_zh: 遥感深度学习工具 }
      - { id: geo-infra,  name: Geospatial Data Infrastructure,   name_zh: 地理空间数据基础设施 }
      - { id: survey,     name: Papers & Resource Collections,    name_zh: 论文与资料合集 }

  - id: knowledge-base
