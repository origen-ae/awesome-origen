    desc_zh: RAG 引擎、文档解析、向量数据库、知识库应用
    children:
      - { id: rag-engine,  name: RAG Engines & Frameworks, name_zh: RAG 引擎与框架 }
      - { id: doc-parsing, name: Document Parsing,         name_zh: 文档解析 }
      - { id: vector-db,   name: Vector Databases,         name_zh: 向量数据库 }
      - { id: kb-app,      name: Knowledge Base Apps,      name_zh: 知识库应用 }
      - { id: practice,    name: RAG Engineering Practices, name_zh: RAG 工程实践 }
